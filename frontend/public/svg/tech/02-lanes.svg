<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" class="a" role="img" aria-label="The three lanes: live in the web, offline bake, compute (training), and replay">
  <!-- Hand-authored (ADR-0058). CSS variables only; both languages in one file (l-en / l-es), identifiers l-neutral. -->
  <style>
    .a text { font-family: var(--font-sans, system-ui, sans-serif); font-size: 11px; fill: var(--fg); }
    .a .mono { font-family: var(--font-mono, ui-monospace, monospace); font-size: 10.5px; }
    .a .ttl { font-size: 13.5px; font-weight: 700; }
    .a .h { font-size: 11.5px; font-weight: 700; }
    .a .sub { fill: var(--fg-muted); font-size: 10px; }
    .a .bx { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1.2; }
    .a .lane { fill: var(--surface); stroke-width: 1.6; }
    .a .lane-web { stroke: var(--cyan); }
    .a .lane-bake { stroke: var(--accent); }
    .a .lane-comp { stroke: var(--magenta); }
    .a .lane-rep { stroke: var(--good); }
    .a .lt-web { fill: var(--cyan); font-size: 12px; font-weight: 700; }
    .a .lt-bake { fill: var(--accent); font-size: 12px; font-weight: 700; }
    .a .lt-comp { fill: var(--magenta); font-size: 12px; font-weight: 700; }
    .a .lt-rep { fill: var(--good); font-size: 12px; font-weight: 700; }
    .a .ln { fill: none; stroke: var(--border-strong); stroke-width: 1.4; marker-end: url(#arr2); }
    .a .ln-d { stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--border-strong)" />
    </marker>
  </defs>

  <text x="20" y="26" class="ttl l-en">Lanes: what runs in the browser, what the bake computes, what the GPU trains, what is replayed</text>
  <text x="20" y="26" class="ttl l-es">Carriles: que corre en el navegador, que calcula la cocina, que entrena la GPU, que se reproduce</text>

  <!-- LIVE lane -->
  <rect x="20" y="44" width="860" height="128" rx="8" class="lane lane-web" />
  <text x="32" y="63" class="lt-web l-en">LIVE in the web (nothing uploaded, no server)</text>
  <text x="32" y="63" class="lt-web l-es">EN VIVO en la web (nada se sube, sin servidor)</text>
  <rect x="32" y="74" width="200" height="86" rx="6" class="bx" />
  <text x="42" y="91" class="h l-en">Sentinel-2 read</text>
  <text x="42" y="91" class="h l-es">Lectura Sentinel-2</text>
  <text x="42" y="106" class="sub l-en">STAC search, then range reads of</text>
  <text x="42" y="106" class="sub l-es">busqueda STAC, luego lecturas por</text>
  <text x="42" y="119" class="sub l-en">seven COGs onto the site grid</text>
  <text x="42" y="119" class="sub l-es">rango de siete COG a la grilla</text>
  <text x="42" y="134" class="mono l-neutral">lib/stac.ts  lib/cog.ts</text>
  <text x="42" y="148" class="mono l-neutral">geotiff.js pool, AbortSignal</text>
  <path d="M232,117 L252,117" class="ln" />
  <rect x="252" y="74" width="230" height="86" rx="6" class="bx" />
  <text x="262" y="91" class="h l-en">Band-math worker</text>
  <text x="262" y="91" class="h l-es">Worker de matematica de bandas</text>
  <text x="262" y="106" class="sub l-en">composites, 9 indices, Otsu, k-means, SAM,</text>
  <text x="262" y="106" class="sub l-es">compuestos, 9 indices, Otsu, k-means, SAM,</text>
  <text x="262" y="119" class="sub l-en">16 feature planes; transferable buffers</text>
  <text x="262" y="119" class="sub l-es">16 planos de atributos; buffers transferibles</text>
  <text x="262" y="134" class="mono l-neutral">workers/indices.worker.ts</text>
  <text x="262" y="148" class="mono l-neutral">workers/features.ts (golden test)</text>
  <path d="M482,117 L502,117" class="ln" />
  <rect x="502" y="74" width="180" height="86" rx="6" class="bx" />
  <text x="512" y="91" class="h l-en">Learned inference</text>
  <text x="512" y="91" class="h l-es">Inferencia aprendida</text>
  <text x="512" y="106" class="sub l-en">random forest on wasm,</text>
  <text x="512" y="106" class="sub l-es">bosque aleatorio en wasm,</text>
  <text x="512" y="119" class="sub l-en">U-Net on webgpu or wasm</text>
  <text x="512" y="119" class="sub l-es">U-Net en webgpu o wasm</text>
  <text x="512" y="134" class="mono l-neutral">workers/onnx.ts</text>
  <text x="512" y="148" class="mono l-neutral">onnxruntime-web 1.29</text>
  <path d="M682,117 L702,117" class="ln" />
  <rect x="702" y="74" width="166" height="86" rx="6" class="bx" />
  <text x="712" y="91" class="h l-en">Live analysis</text>
  <text x="712" y="91" class="h l-es">Analisis en vivo</text>
  <text x="712" y="106" class="sub l-en">PELT rerun with a penalty,</text>
  <text x="712" y="106" class="sub l-es">PELT reejecutado con penalizacion,</text>
  <text x="712" y="119" class="sub l-en">terrain profile from tiles</text>
  <text x="712" y="119" class="sub l-es">perfil de terreno desde teselas</text>
  <text x="712" y="134" class="mono l-neutral">lib/changepoints.ts</text>
  <text x="712" y="148" class="mono l-neutral">map/reliefOverlay.ts</text>

  <!-- BAKE lane -->
  <rect x="20" y="186" width="560" height="176" rx="8" class="lane lane-bake" />
  <text x="32" y="205" class="lt-bake l-en">OFFLINE bake (Python 3.12 venv, plain scripts by path, detached and parallel)</text>
  <text x="32" y="205" class="lt-bake l-es">Cocina OFFLINE (venv Python 3.12, scripts planos por ruta, desacoplada y paralela)</text>
  <rect x="32" y="216" width="126" height="64" rx="6" class="bx" />
  <text x="42" y="233" class="mono l-neutral">catalog</text>
  <text x="42" y="248" class="sub l-en">sites validated on</text>
  <text x="42" y="248" class="sub l-es">sitios validados con</text>
  <text x="42" y="261" class="sub l-en">Maus 2022 polygons</text>
  <text x="42" y="261" class="sub l-es">poligonos Maus 2022</text>
  <path d="M158,248 L170,248" class="ln" />
  <rect x="170" y="216" width="126" height="64" rx="6" class="bx" />
  <text x="180" y="233" class="mono l-neutral">scenes</text>
  <text x="180" y="248" class="sub l-en">Earth Search and</text>
  <text x="180" y="248" class="sub l-es">Earth Search y</text>
  <text x="180" y="261" class="sub l-en">Planetary Computer</text>
  <text x="180" y="261" class="sub l-es">Planetary Computer</text>
  <path d="M296,248 L308,248" class="ln" />
  <rect x="308" y="216" width="126" height="64" rx="6" class="bx" />
  <text x="318" y="233" class="mono l-neutral">frames</text>
  <text x="318" y="248" class="sub l-en">WarpedVRT reads, L7 gap</text>
  <text x="318" y="248" class="sub l-es">lecturas WarpedVRT, L7</text>
  <text x="318" y="261" class="sub l-en">compositing, WebP, chips</text>
  <text x="318" y="261" class="sub l-es">compuesto, WebP, chips</text>
  <path d="M434,248 L446,248" class="ln" />
  <rect x="446" y="216" width="122" height="64" rx="6" class="bx" />
  <text x="456" y="233" class="mono l-neutral">masks / series</text>
  <text x="456" y="248" class="sub l-en">Otsu, RF, U-Net per year;</text>
  <text x="456" y="248" class="sub l-es">Otsu, RF, U-Net por ano;</text>
  <text x="456" y="261" class="sub l-en">CUSUM, PELT, harmonic</text>
  <text x="456" y="261" class="sub l-es">CUSUM, PELT, armonica</text>
  <rect x="32" y="290" width="164" height="60" rx="6" class="bx" />
  <text x="42" y="307" class="mono l-neutral">dense</text>
  <text x="42" y="322" class="sub l-en">every clear S2 date since 2017</text>
  <text x="42" y="322" class="sub l-es">cada fecha S2 clara desde 2017</text>
  <text x="42" y="335" class="sub l-en">at 60 m from COG overviews</text>
  <text x="42" y="335" class="sub l-es">a 60 m desde overviews COG</text>
  <rect x="206" y="290" width="164" height="60" rx="6" class="bx" />
  <text x="216" y="307" class="mono l-neutral">dem</text>
  <text x="216" y="322" class="sub l-en">SRTM vs Copernicus, geoid,</text>
  <text x="216" y="322" class="sub l-es">SRTM vs Copernicus, geoide,</text>
  <text x="216" y="335" class="sub l-en">noise floor, terrain tiles</text>
  <text x="216" y="335" class="sub l-es">piso de ruido, teselas</text>
  <rect x="380" y="290" width="188" height="60" rx="6" class="bx" />
  <text x="390" y="307" class="mono l-neutral">export / validate</text>
  <text x="390" y="322" class="sub l-en">manifests with bytes + sha256;</text>
  <text x="390" y="322" class="sub l-es">manifiestos con bytes + sha256;</text>
  <text x="390" y="335" class="sub l-en">a hole is refused</text>
  <text x="390" y="335" class="sub l-es">un hueco se rechaza</text>

  <!-- COMPUTE lane -->
  <rect x="596" y="186" width="284" height="176" rx="8" class="lane lane-comp" />
  <text x="608" y="205" class="lt-comp l-en">COMPUTE (the GPU lane)</text>
  <text x="608" y="205" class="lt-comp l-es">COMPUTO (el carril GPU)</text>
  <rect x="608" y="216" width="260" height="42" rx="6" class="bx" />
  <text x="618" y="233" class="mono l-neutral">train/fetch_tiles.py</text>
  <text x="618" y="248" class="sub l-en">1,207 Jasansky 2024 tiles from Earth Search, 25 held out</text>
  <text x="618" y="248" class="sub l-es">1.207 teselas Jasansky 2024, 25 retenidas</text>
  <rect x="608" y="266" width="126" height="42" rx="6" class="bx" />
  <text x="618" y="283" class="mono l-neutral">train_rf.py</text>
  <text x="618" y="298" class="sub l-en">skl2onnx, parity 1e-5</text>
  <text x="618" y="298" class="sub l-es">skl2onnx, paridad 1e-5</text>
  <rect x="742" y="266" width="126" height="42" rx="6" class="bx" />
  <text x="752" y="283" class="mono l-neutral">train_unet.py</text>
  <text x="752" y="298" class="sub l-en">AMP, early stop, fp16</text>
  <text x="752" y="298" class="sub l-es">AMP, parada, fp16</text>
  <rect x="608" y="316" width="260" height="34" rx="6" class="bx" />
  <text x="618" y="333" class="mono l-neutral">evaluate.py</text>
  <text x="700" y="333" class="sub l-en">held-out matrix, M4 to M8, haze</text>
  <text x="700" y="333" class="sub l-es">matriz retenida, M4 a M8, bruma</text>

  <!-- REPLAY lane -->
  <rect x="20" y="376" width="860" height="80" rx="8" class="lane lane-rep" />
  <text x="32" y="395" class="lt-rep l-en">REPLAY (the shared fallback: the web loads committed artifacts, never recomputes the bake)</text>
  <text x="32" y="395" class="lt-rep l-es">REPRODUCCION (el respaldo comun: la web carga artefactos versionados, nunca recomputa la cocina)</text>
  <text x="32" y="416" class="mono l-neutral">data/derived/catalog.json  sites/&lt;id&gt;/manifest.json  frames/  masks/  series.json  dense.json  dem.json  terrain/{z}/{x}/{y}.png</text>
  <text x="32" y="434" class="mono l-neutral">models/registry.json  models/rf/rf-v1.onnx  models/unet/unet-v1.onnx (+fp16)  models/benchmark.json</text>
  <text x="32" y="449" class="sub l-en">copy-data.mjs overlays these into public/ at build; contract.ts reads only what a manifest declares.</text>
  <text x="32" y="449" class="sub l-es">copy-data.mjs los superpone en public/ al construir; contract.ts lee solo lo que un manifiesto declara.</text>

  <!-- flows between lanes -->
  <path d="M330,172 L330,186" class="ln ln-d" />
  <path d="M760,172 L760,186" class="ln ln-d" />
  <path d="M470,362 L470,376" class="ln" />
  <path d="M738,362 L738,376" class="ln" />

  <text x="20" y="484" class="sub l-en">Live and bake share one definition of every index and mask: the Python mirrors (data-pipeline/train/baselines.py, common.py) and the TypeScript</text>
  <text x="20" y="484" class="sub l-es">Vivo y cocina comparten una definicion de cada indice y mascara: los espejos Python (data-pipeline/train/baselines.py, common.py) y el TypeScript</text>
  <text x="20" y="498" class="sub l-en">(lib/indices.ts, workers/features.ts, lib/changepoints.ts) are pinned to each other by golden fixtures generated from Python and replayed in vitest.</text>
  <text x="20" y="498" class="sub l-es">(lib/indices.ts, workers/features.ts, lib/changepoints.ts) se fijan entre si con fixtures dorados generados desde Python y reproducidos en vitest.</text>
  <text x="20" y="518" class="sub l-en">The venv, the chips and the checkpoints never ship; the site is static files on nginx.</text>
  <text x="20" y="518" class="sub l-es">El venv, los chips y los checkpoints nunca se despliegan; el sitio son archivos estaticos en nginx.</text>
</svg>
