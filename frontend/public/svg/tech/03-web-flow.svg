<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" class="a" role="img" aria-label="The web-app flow: the observatory, its overlays, the doc pages, the build and the deploy">
  <!-- Hand-authored (ADR-0058). CSS variables only; both languages in one file (l-en / l-es), identifiers l-neutral. -->
  <style>
    .a text { font-family: var(--font-sans, system-ui, sans-serif); font-size: 11px; fill: var(--fg); }
    .a .mono { font-family: var(--font-mono, ui-monospace, monospace); font-size: 10.5px; }
    .a .ttl { font-size: 13.5px; font-weight: 700; }
    .a .h { font-size: 11.5px; font-weight: 700; }
    .a .sub { fill: var(--fg-muted); font-size: 10px; }
    .a .bx { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1.2; }
    .a .stage { fill: var(--surface); stroke: var(--accent); stroke-width: 1.6; }
    .a .ov { fill: var(--surface-2); stroke: var(--cyan); stroke-width: 1.2; }
    .a .ln { fill: none; stroke: var(--border-strong); stroke-width: 1.4; marker-end: url(#arr3); }
    .a .acc { fill: var(--accent); }
    .a .good { fill: var(--good); }
  </style>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--border-strong)" />
    </marker>
  </defs>

  <text x="20" y="26" class="ttl l-en">The web app: one instrument page, four documentation pages, a static build with a gate at every step</text>
  <text x="20" y="26" class="ttl l-es">La app web: una pagina instrumento, cuatro paginas de documentacion, una construccion estatica con compuerta en cada paso</text>

  <!-- the observatory stage -->
  <rect x="20" y="44" width="560" height="290" rx="8" class="stage" />
  <text x="32" y="63" class="h l-en">Observatory (the page is the viewport; the map is the instrument)</text>
  <text x="32" y="63" class="h l-es">Observatorio (la pagina es la ventana; el mapa es el instrumento)</text>
  <text x="32" y="78" class="mono l-neutral">pages/Observatory.tsx  map/MapView.tsx (MapLibre GL, globe, raster-dem, hillshade)</text>

  <!-- rail -->
  <rect x="32" y="90" width="130" height="150" rx="6" class="ov" />
  <text x="42" y="107" class="h l-en">Rail</text>
  <text x="42" y="107" class="h l-es">Riel</text>
  <text x="42" y="122" class="sub l-en">site selector by</text>
  <text x="42" y="122" class="sub l-es">selector de sitio por</text>
  <text x="42" y="135" class="sub l-en">category; the card:</text>
  <text x="42" y="135" class="sub l-es">categoria; la ficha:</text>
  <text x="42" y="148" class="sub l-en">window, polygons,</text>
  <text x="42" y="148" class="sub l-es">ventana, poligonos,</text>
  <text x="42" y="161" class="sub l-en">sourced facts</text>
  <text x="42" y="161" class="sub l-es">hechos con fuente</text>
  <text x="42" y="180" class="mono l-neutral">state/site.ts</text>
  <text x="42" y="194" class="mono l-neutral">state/catalog.ts</text>
  <text x="42" y="212" class="sub l-en">URL carries ?site=</text>
  <text x="42" y="212" class="sub l-es">la URL lleva ?site=</text>

  <!-- map layers stack -->
  <rect x="174" y="90" width="248" height="150" rx="6" class="ov" />
  <text x="184" y="107" class="h l-en">Map layers (bottom to top)</text>
  <text x="184" y="107" class="h l-es">Capas del mapa (de abajo arriba)</text>
  <text x="184" y="124" class="mono l-neutral">imagery: EOX S2 cloudless</text>
  <text x="184" y="138" class="mono l-neutral">terrain: terrarium or site COP</text>
  <text x="184" y="152" class="mono l-neutral">frame-layer: yearly WebP</text>
  <text x="184" y="166" class="mono l-neutral">frame-mask-layer: tinted PNG</text>
  <text x="184" y="180" class="mono l-neutral">dem-delta-layer: diverging PNG</text>
  <text x="184" y="194" class="mono l-neutral">live-layer: RGBA from worker</text>
  <text x="184" y="208" class="mono l-neutral">site-polygons, window, profile</text>
  <text x="184" y="222" class="mono l-neutral">labels: OpenFreeMap vectors</text>

  <!-- instrument -->
  <rect x="434" y="90" width="134" height="150" rx="6" class="ov" />
  <text x="444" y="107" class="h l-en">Instrument</text>
  <text x="444" y="107" class="h l-es">Instrumento</text>
  <text x="444" y="124" class="mono l-neutral">Look Find Relief</text>
  <text x="444" y="140" class="sub l-en">live scene loader,</text>
  <text x="444" y="140" class="sub l-es">carga de escena,</text>
  <text x="444" y="153" class="sub l-en">composites, indices,</text>
  <text x="444" y="153" class="sub l-es">compuestos, indices,</text>
  <text x="444" y="166" class="sub l-en">masks, learned models,</text>
  <text x="444" y="166" class="sub l-es">mascaras, modelos,</text>
  <text x="444" y="179" class="sub l-en">epoch, delta, profile</text>
  <text x="444" y="179" class="sub l-es">epoca, delta, perfil</text>
  <text x="444" y="198" class="mono l-neutral">Instrument.tsx</text>
  <text x="444" y="212" class="mono l-neutral">ReliefPanel.tsx</text>
  <text x="444" y="226" class="mono l-neutral">live.ts relief.ts</text>

  <!-- series drawer + timeline -->
  <rect x="32" y="250" width="536" height="34" rx="6" class="ov" />
  <text x="42" y="271" class="h l-en">Series drawer</text>
  <text x="42" y="271" class="h l-es">Cajon de series</text>
  <text x="140" y="271" class="sub l-en">uPlot: area per method, Landsat shaded, PELT breaks, CUSUM alarms, dense series, live penalty</text>
  <text x="140" y="271" class="sub l-es">uPlot: area por metodo, Landsat sombreado, quiebres PELT, alarmas CUSUM, serie densa</text>
  <rect x="32" y="292" width="536" height="32" rx="6" class="ov" />
  <text x="42" y="312" class="h l-en">Timeline</text>
  <text x="42" y="312" class="h l-es">Linea de tiempo</text>
  <text x="140" y="312" class="sub l-en">paused by default, keyboard, ticks, sensor, date, flags, true colour / SWIR, opacity</text>
  <text x="140" y="312" class="sub l-es">en pausa por defecto, teclado, marcas, sensor, fecha, banderas, color / SWIR, opacidad</text>

  <!-- documentation pages -->
  <rect x="596" y="44" width="284" height="290" rx="8" class="bx" />
  <text x="608" y="63" class="h l-en">Documentation pages (read the same artifacts)</text>
  <text x="608" y="63" class="h l-es">Paginas de documentacion (mismos artefactos)</text>
  <rect x="608" y="74" width="260" height="46" rx="6" class="bx" />
  <text x="618" y="91" class="mono l-neutral">/atlas  pages/AtlasPage.tsx</text>
  <text x="618" y="107" class="sub l-en">the catalog table: site, country, categories, seed, frames</text>
  <text x="618" y="107" class="sub l-es">la tabla del catalogo: sitio, pais, categorias, cuadros</text>
  <rect x="608" y="128" width="260" height="58" rx="6" class="bx" />
  <text x="618" y="145" class="mono l-neutral">/methods  pages/MethodsPage.tsx</text>
  <text x="618" y="161" class="sub l-en">twelve methods with KaTeX equations, DOIs,</text>
  <text x="618" y="161" class="sub l-es">doce metodos con ecuaciones KaTeX, DOI,</text>
  <text x="618" y="174" class="sub l-en">lane badges, caveats, the held-out benchmark</text>
  <text x="618" y="174" class="sub l-es">carriles, salvedades, el benchmark retenido</text>
  <rect x="608" y="194" width="260" height="58" rx="6" class="bx" />
  <text x="618" y="211" class="mono l-neutral">/data  pages/DataPage.tsx</text>
  <text x="618" y="227" class="sub l-en">sources probed for CORS and licence, attribution</text>
  <text x="618" y="227" class="sub l-es">fuentes probadas por CORS y licencia, atribucion</text>
  <text x="618" y="240" class="sub l-en">verbatim, the two contracts, the catalog summary</text>
  <text x="618" y="240" class="sub l-es">textual, los dos contratos, resumen del catalogo</text>
  <rect x="608" y="260" width="260" height="46" rx="6" class="bx" />
  <text x="618" y="277" class="mono l-neutral">/about  pages/AboutPage.tsx  + this modal</text>
  <text x="618" y="293" class="sub l-en">what Rajo is, versioning, honesty, how to cite</text>
  <text x="618" y="293" class="sub l-es">que es Rajo, versionado, honestidad, como citar</text>
  <text x="608" y="324" class="sub l-en">EN and ES, light and dark, no flash of the wrong theme.</text>
  <text x="608" y="324" class="sub l-es">EN y ES, claro y oscuro, sin destello del tema equivocado.</text>

  <!-- build + deploy row -->
  <text x="20" y="360" class="h l-en">Build, verify, ship</text>
  <text x="20" y="360" class="h l-es">Construir, verificar, enviar</text>
  <rect x="20" y="370" width="150" height="76" rx="7" class="bx" />
  <text x="30" y="388" class="mono l-neutral">copy-data.mjs</text>
  <text x="30" y="404" class="sub l-en">overlays data/derived, models/</text>
  <text x="30" y="404" class="sub l-es">superpone derived y models</text>
  <text x="30" y="417" class="sub l-en">and ORT runtime into public/</text>
  <text x="30" y="417" class="sub l-es">y el runtime ORT en public/</text>
  <text x="30" y="434" class="sub l-en">copies, never computes</text>
  <text x="30" y="434" class="sub l-es">copia, nunca calcula</text>
  <path d="M170,408 L190,408" class="ln" />
  <rect x="190" y="370" width="150" height="76" rx="7" class="bx" />
  <text x="200" y="388" class="mono l-neutral">vite build</text>
  <text x="200" y="404" class="sub l-en">typecheck (strict), vitest,</text>
  <text x="200" y="404" class="sub l-es">typecheck (estricto), vitest,</text>
  <text x="200" y="417" class="sub l-en">the MapLibre worker bundled</text>
  <text x="200" y="417" class="sub l-es">worker MapLibre empaquetado</text>
  <text x="200" y="434" class="sub l-en">and registered (setWorkerUrl)</text>
  <text x="200" y="434" class="sub l-es">y registrado (setWorkerUrl)</text>
  <path d="M340,408 L360,408" class="ln" />
  <rect x="360" y="370" width="176" height="76" rx="7" class="bx" />
  <text x="370" y="388" class="mono l-neutral">tests/*.spec.ts</text>
  <text x="370" y="404" class="sub l-en">Playwright gates by use: fit, chrome,</text>
  <text x="370" y="404" class="sub l-es">compuertas por uso: fit, chrome,</text>
  <text x="370" y="417" class="sub l-en">timeline, live, learned, series, relief;</text>
  <text x="370" y="417" class="sub l-es">timeline, live, learned, series, relief;</text>
  <text x="370" y="434" class="sub l-en">each asserts the title and WAITS</text>
  <text x="370" y="434" class="sub l-es">cada una afirma el titulo y ESPERA</text>
  <path d="M536,408 L550,408" class="ln" />
  <rect x="550" y="370" width="160" height="76" rx="7" class="bx" />
  <text x="560" y="388" class="mono l-neutral">deploy/deploy.ps1 (.sh)</text>
  <text x="560" y="404" class="sub l-en">guards, build, tar over ssh into</text>
  <text x="560" y="404" class="sub l-es">guardas, build, tar por ssh a</text>
  <text x="560" y="417" class="sub l-en">a release dir, atomic symlink</text>
  <text x="560" y="417" class="sub l-es">un dir de release, symlink atomico</text>
  <text x="560" y="434" class="sub l-en">swap, nginx reload</text>
  <text x="560" y="434" class="sub l-es">cambio, recarga de nginx</text>
  <path d="M710,408 L730,408" class="ln" />
  <rect x="730" y="370" width="150" height="76" rx="7" class="bx" />
  <text x="740" y="388" class="mono l-neutral">rajo.fasl-work.com</text>
  <text x="740" y="404" class="sub l-en">live content check: the title,</text>
  <text x="740" y="404" class="sub l-es">verificacion en vivo: titulo,</text>
  <text x="740" y="417" class="sub l-en">catalog.json byte-identical,</text>
  <text x="740" y="417" class="sub l-es">catalog.json identico,</text>
  <text x="740" y="434" class="sub l-en">a deep link answering 200</text>
  <text x="740" y="434" class="sub l-es">un enlace profundo con 200</text>

  <text x="20" y="474" class="sub l-en">The renderer declares what it drew: window.__rajoMap and window.__rajoMapLifecycle expose the map and its load events so the gates read layers, sources and the terrain</text>
  <text x="20" y="474" class="sub l-es">El renderizador declara lo que dibujo: window.__rajoMap y window.__rajoMapLifecycle exponen el mapa y sus eventos de carga para que las compuertas lean capas, fuentes y terreno</text>
  <text x="20" y="488" class="sub l-en">epoch instead of sampling pixels blindly. CI (dispatched per push) runs the pipeline tests, the frontend typecheck, unit tests and build, and the repository guards.</text>
  <text x="20" y="488" class="sub l-es">y la epoca en lugar de muestrear pixeles a ciegas. CI (despachado por push) corre las pruebas del pipeline, el typecheck, las pruebas unitarias, el build y las guardas.</text>
  <text x="20" y="512" class="mono l-neutral">ports: dev 5901, preview 4901 (registered); static site, no port on the host</text>
</svg>
